# 5 分ごとに同期（同期本体は 4 分で打ち切り、残りは次回に回す）
apiVersion: batch/v1
kind: CronJob
metadata:
  name: calendar-sync
spec:
  schedule: "*/5 * * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 290
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
          containers:
            - name: sync
              image: curlimages/curl:8.10.1
              env:
                - name: TOKEN
                  valueFrom:
                    secretKeyRef: { name: calendar-sync-secrets, key: CALENDAR_SYNC_CRON_TOKEN }
              command: ["sh", "-c"]
              args:
                - >-
                  curl -sS --fail-with-body --max-time 280 -X POST
                  -H "Authorization: Bearer $TOKEN" http://calendar-sync/api/calendar-sync
