# Datadog Agent（Helm: datadog/datadog）。README.md の手順で入れる
datadog:
  # API キーは Secret から読む（install.sh がファイルから作る）
  apiKeyExistingSecret: datadog-secret
  # アカウントのサイト（ログイン後の URL: https://us5.datadoghq.com）
  site: us5.datadoghq.com
  clusterName: taramanji-macmini
  tags:
    - env:production
    - host_type:mac-mini
  # OrbStack の kubelet は自己署名証明書
  kubelet:
    tlsVerify: false
  # Pod のログ
  logs:
    enabled: true
    containerCollectAll: true
  # アプリからの DogStatsD（UDP 8125）。アプリは DD_AGENT_HOST=ノードの IP に送る
  dogstatsd:
    useHostPort: true
    nonLocalTraffic: true
  # Pod の状態（再起動回数・Ready など）
  kubeStateMetricsCore:
    enabled: true
  processAgent:
    processCollection: false
  apm:
    portEnabled: false
clusterAgent:
  enabled: true
agents:
  containers:
    agent:
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 512Mi }
