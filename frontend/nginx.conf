# React（Vite）のビルド結果を配る。非 root（nginx-unprivileged）で 8080 番、ルートファイルシステムは読み取り専用
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format json escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,'
                              '"bytes":$body_bytes_sent,"duration":$request_time,"ua":"$http_user_agent","ip":"$http_cf_connecting_ip"}';
  access_log /dev/stdout json;

  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
      access_log off;
      return 200 "ok";
    }

    # ファイル名にハッシュが付いたビルド成果物は 1 年キャッシュ
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }

    # 画像などの public/ のファイル
    location ~* \.(png|jpe?g|svg|ico|webp)$ {
      add_header Cache-Control "public, max-age=86400" always;
      try_files $uri =404;
    }

    # SPA: それ以外は index.html（毎回確認して、新しい版にすぐ切り替わるように）
    location / {
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header X-Frame-Options DENY always;
      try_files $uri /index.html;
    }
  }
}
