<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_shared.css" />
<style>
  .note-top { display: flex; align-items: center; gap: 8px; }
  .note-top img { width: 24px; height: 24px; object-fit: contain; }
  .row { display: grid; grid-template-columns: repeat(3, 260px); column-gap: 96px; }
  .row + .row { margin-top: 84px; }
  .layer { min-height: 112px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .layer .logos { margin-bottom: 8px; }
  .layer .logos img { width: 28px; height: 28px; }
  .layer .logos img.wide { width: 62px; }
</style>
</head>
<body>
<div class="page">
  <div class="note-top"><img src="icons/go.svg" alt="" /> handler と型は proto から自動で生成する <img src="icons/buf.svg" alt="" /></div>
  <div class="row">
    <div class="layer white" id="handler">
      <div class="logos"><img src="icons/connect.png" alt="" /><img class="wide" src="icons/grpc.svg" alt="" /></div>
      <div class="name">handler</div>
      <div class="sub">Connect / gRPC・HTTP</div>
    </div>
    <div class="layer pale-yellow" id="usecase">
      <div class="name">usecase</div>
      <div class="sub">アプリケーションの処理</div>
    </div>
    <div class="layer bright-yellow" id="domain">
      <div class="name">domain</div>
      <div class="sub">エンティティ・ルール</div>
    </div>
  </div>
  <div class="row">
    <div class="layer gray" id="di">
      <div class="name">di</div>
      <div class="sub">組み立て</div>
    </div>
    <div></div>
    <div class="layer blue" id="infra">
      <div class="logos"><img src="icons/redis-icons8.jpg" alt="" /></div>
      <div class="name">infra</div>
      <div class="sub">Redis・外部 API</div>
    </div>
  </div>
</div>
<script>
  window.LINKS = [
    { from: "handler:right", to: "usecase:left", route: "h" },
    { from: "usecase:right", to: "domain:left", route: "h" },
    { from: "di:top", to: "handler:bottom", route: "v", label: "組み立て" },
    { from: "di:right", to: "infra:left", route: "h" },
    { from: "infra:top", to: "domain:bottom", route: "v", label: "実装する", dashed: true },
  ];
</script>
<script src="_arrows.js"></script>
</body>
</html>
