<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_shared.css" />
<style>
  .layout { display: flex; gap: 120px; align-items: stretch; }
  .envoy-col { display: flex; flex-direction: column; justify-content: center; flex: 0 0 180px; }
  .envoy-col .card { flex-direction: column; text-align: center; justify-content: center; min-height: 128px; }
  .main { display: flex; flex-direction: column; gap: 24px; }
  .backend { background: #eef3fb; }
  .svc-grid { display: grid; grid-template-columns: repeat(4, 196px); column-gap: 84px; row-gap: 22px; }
  .svc-grid .card { flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 6px; min-height: 108px; }
  .svc-grid .card img.go { width: 44px; height: 26px; object-fit: contain; }
  .svc-grid .card .tag { margin: 4px 0 0; }
  .redis-bar {
    margin-top: 40px;
    background: #f3f4f6;
    border: 1px solid #e2e5ea;
    border-radius: 16px;
    box-shadow: 0 8px 18px rgba(28, 43, 69, 0.06);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .redis-bar img { width: 36px; height: 36px; object-fit: contain; }
  .redis-bar .name { font-size: 18px; font-weight: 700; }
  .redis-bar .sub { font-size: 13px; color: #5c6b84; font-weight: 500; }
</style>
</head>
<body>
<div class="page">
  <div class="layout">
    <div class="envoy-col">
      <div class="card" id="envoy">
        <img class="logo" src="icons/envoy.svg" alt="" />
        <div class="name">Envoy<br />Gateway</div>
      </div>
    </div>
    <div class="main">
      <div class="card" id="web">
        <div class="logos">
          <img src="icons/nginx.svg" alt="" />
          <img src="icons/react.svg" alt="" />
        </div>
        <div>
          <div class="name">web（nginx + React）</div>
          <div class="sub">Vite ビルド成果物を nginx で配信</div>
        </div>
      </div>
      <div class="group backend" id="backend">
        <div class="glabel"><img src="icons/k8s.svg" alt="" /> backend : Go のサービス 8 つ</div>
        <div class="svc-grid">
          <div class="card" id="identity"><img class="go" src="icons/go.svg" alt="" /><div><div class="name">identity</div><div class="sub">ログイン</div></div></div>
          <div class="card" id="content"><img class="go" src="icons/go.svg" alt="" /><div><div class="name">content</div><div class="sub">記事一覧</div></div></div>
          <div class="card accent-yellow" id="reservation"><img class="go" src="icons/go.svg" alt="" /><div><div class="name">reservation</div><div class="sub">予約</div></div></div>
          <div class="card" id="worklocation"><img class="go" src="icons/go.svg" alt="" /><div><div class="name">worklocation</div><div class="sub">勤務場所</div></div></div>
          <div class="card" id="analytics"><img class="go" src="icons/go.svg" alt="" /><div><div class="name">analytics</div><div class="sub">アクセス解析</div></div></div>
          <div class="card accent-yellow" id="inquiry"><img class="go" src="icons/go.svg" alt="" /><div><div class="name">inquiry</div><div class="sub">お問い合わせ</div></div></div>
          <div class="card accent-gray" id="notification"><img class="go" src="icons/go.svg" alt="" /><div><div class="name">notification</div><div class="sub">メール送信 ・ 内部専用</div></div></div>
          <div class="card" id="calendarsync"><img class="go" src="icons/go.svg" alt="" /><div><div class="name">calendarsync</div><div class="sub">カレンダー同期</div></div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="redis-bar" id="redis">
    <img src="icons/redis-icons8.jpg" alt="" />
    <div class="name">Redis</div>
  </div>
</div>
<script>
  const RED = "#c0392b";
  const GRPC = { logo: "icons/grpc.svg", logoW: 58, logoH: 22, color: RED, width: 2.5 };
  window.LINKS = [
    { from: "envoy:right@0.3", to: "web:left", route: "hvh", label: "画面", labelSeg: 0 },
    { from: "envoy:right@0.7", to: "backend:left", route: "hvh", label: "Connect", labelSeg: 0, logo: "icons/connect.png", logoW: 22, logoH: 22, labelSide: "below" },
    { from: "reservation:right", to: "worklocation:left", route: "h", ...GRPC },
    { from: "inquiry:right", to: "notification:left", route: "h", ...GRPC },
    { from: "backend:bottom", to: "redis:top", route: "v", label: "読み書き" },
  ];
</script>
<script src="_arrows.js"></script>
</body>
</html>
