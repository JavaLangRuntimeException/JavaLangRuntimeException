<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_shared.css" />
<style>
  .layout { display: flex; gap: 14px; align-items: stretch; }
  .envoy-col {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    flex: 0 0 200px;
  }
  .envoy-col .card { flex-direction: column; text-align: center; justify-content: center; min-height: 120px; }
  .main { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .frontend-row .card { width: 100%; }
  .logos-duo { display: flex; gap: 8px; flex: 0 0 auto; align-items: center; }
  .logos-duo .logo { width: 36px; height: 36px; }
  .section-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 700;
    color: #243656;
    margin: 4px 0 2px;
  }
  .section-label img { width: 22px; height: 22px; }
  .grid-wrap { position: relative; width: 920px; }
  .svc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .svc-grid .card {
    flex-direction: column;
    align-items: flex-start;
    min-height: 96px;
    position: relative;
  }
  .svc-grid .card .go {
    width: 28px;
    height: 28px;
    position: absolute;
    top: 12px;
    left: 12px;
  }
  .svc-grid .card .text { margin-top: 32px; width: 100%; }
  .svc-grid .card.internal .sub.extra { font-size: 12px; margin-top: 4px; }
  .arrows {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: visible;
  }
  .redis-bar {
    margin-top: 14px;
    background: #f3f4f6;
    border: 1px solid #e2e5ea;
    border-radius: 16px;
    box-shadow: 0 8px 18px rgba(28, 43, 69, 0.06);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .redis-bar img { width: 36px; height: 36px; object-fit: contain; }
  .redis-bar .name { font-size: 18px; font-weight: 700; }
  .grpc-label {
    font-size: 11px;
    font-weight: 800;
    fill: #c0392b;
  }
</style>
</head>
<body>
<div class="page">
  <div class="layout">
    <div class="envoy-col">
      <div class="arrow-h" style="text-align:center;">→</div>
      <div class="card">
        <img class="logo" src="icons/envoy.svg" alt="" />
        <div class="name">Envoy<br />Gateway</div>
      </div>
      <div class="arrow-h" style="text-align:center;">→</div>
    </div>
    <div class="main">
      <div class="frontend-row">
        <div class="card">
          <div class="logos-duo">
            <img class="logo" src="icons/nginx.svg" alt="" />
            <img class="logo" src="icons/react.svg" alt="" />
          </div>
          <div>
            <div class="name">web（nginx + React）</div>
            <div class="sub">Vite ビルド成果物を nginx で配信</div>
          </div>
        </div>
      </div>
      <div class="section-label"><img src="icons/k8s.svg" alt="" /> backend : Go のサービス 8 つ</div>
      <div class="grid-wrap">
        <div class="svc-grid">
          <div class="card">
            <img class="go" src="icons/go.svg" alt="" />
            <div class="text"><div class="name">identity</div><div class="sub">ログイン</div></div>
          </div>
          <div class="card">
            <img class="go" src="icons/go.svg" alt="" />
            <div class="text"><div class="name">analytics</div><div class="sub">アクセス解析</div></div>
          </div>
          <div class="card">
            <img class="go" src="icons/go.svg" alt="" />
            <div class="text"><div class="name">content</div><div class="sub">記事一覧</div></div>
          </div>
          <div class="card accent-yellow">
            <img class="go" src="icons/go.svg" alt="" />
            <div class="text"><div class="name">inquiry</div><div class="sub">お問い合わせ</div></div>
          </div>
          <div class="card accent-blue internal">
            <img class="go" src="icons/go.svg" alt="" />
            <div class="text">
              <div class="name">notification</div>
              <div class="sub">メール送信</div>
              <div class="sub extra">内部専用</div>
            </div>
          </div>
          <div class="card accent-yellow">
            <img class="go" src="icons/go.svg" alt="" />
            <div class="text"><div class="name">reservation</div><div class="sub">予約</div></div>
          </div>
          <div class="card">
            <img class="go" src="icons/go.svg" alt="" />
            <div class="text"><div class="name">worklocation</div><div class="sub">勤務場所</div></div>
          </div>
          <div class="card">
            <img class="go" src="icons/go.svg" alt="" />
            <div class="text"><div class="name">calendarsync</div><div class="sub">カレンダー同期</div></div>
          </div>
        </div>
        <svg class="arrows" viewBox="0 0 920 210" preserveAspectRatio="none">
          <defs>
            <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b" />
            </marker>
          </defs>
          <path d="M 805 92 C 805 128, 115 128, 115 152" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow-red)" />
          <text x="430" y="118" class="grpc-label">gRPC</text>
          <path d="M 355 168 L 565 168" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow-red)" />
          <text x="430" y="158" class="grpc-label">gRPC</text>
        </svg>
      </div>
    </div>
  </div>
  <div class="redis-bar">
    <img src="icons/redis-icons8.jpg" alt="" />
    <div class="name">Redis</div>
  </div>
</div>
</body>
</html>
