# taramanji cloud のコンソール（React + Vite のビルド結果）を配る。非 root（nginx-unprivileged）で 8080 番、ルートファイルシステムは読み取り専用
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format json escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,'
                              '"bytes":$body_bytes_sent,"duration":$request_time,"ua":"$http_user_agent","ip":"$http_cf_connecting_ip"}';
  access_log /dev/stdout json;

  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # キャッシュしてよいのは 200 だけ（入れ替えの途中の 404 を Cloudflare とブラウザが持ち続けないように）
  map $status $assets_cache_control {
    200     "public, max-age=31536000, immutable";
    default "no-store";
  }

  # 外部のスクリプト・フォント・CDN は使わない。API は同じオリジンの Connect だけ
  map $host $csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # add_header は location に 1 つでもあると親の分が引き継がれないので、各 location で include 相当を繰り返す
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
      access_log off;
      return 200 "ok";
    }

    # ファイル名にハッシュが付いたビルド成果物は 1 年キャッシュ
    location /assets/ {
      add_header Cache-Control $assets_cache_control always;
      add_header Content-Security-Policy $csp always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options DENY always;
      try_files $uri =404;
    }

    # SPA: それ以外は index.html。毎回取り直して、新しい版にすぐ切り替わるように
    location / {
      try_files $uri /index.html;
    }

    location = /index.html {
      add_header Cache-Control "no-store" always;
      add_header Content-Security-Policy $csp always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options DENY always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
  }
}
