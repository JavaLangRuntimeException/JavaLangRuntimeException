# dev02（同じ kind の taramanji-dev02 namespace）。dev は dev01〜03 の 3 つあり、main への PR（と手動実行）で
# CI が「その PR がいま入っている devN」か、なければ「一番前に使われた devN」を選び、版を書き換えて Argo CD が同期する。
# 版は stg（main の最新）に、その PR で作り直したサービスだけを重ねたもの。
# 本番との違い: components/nonprod（1 台ずつ・HPA/PDB なし・カナリアなし）・ホスト名 dev02.taramanji.com / dev02-gws.taramanji.com
# （Cloudflare Access で本人だけ）・Redis も同じ namespace
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taramanji-dev02
resources:
  - namespace.yaml
  - ../../base/apps
  - ../../base/data
  - ../../base/routes
  - sealed
components:
  # 1 台ずつ・HPA/PDB なし・Rollout（カナリアなし）・CronJob 停止
  - ../../components/nonprod

# set-version.sh / copy-versions.sh が書き換える（CI の deploy-dev ジョブ）
images:
  - { name: taramanji/identity, newName: ghcr.io/javalangruntimeexception/taramanji-identity, newTag: sha-bb6c8f2 }
  - { name: taramanji/notification, newName: ghcr.io/javalangruntimeexception/taramanji-notification, newTag: sha-bb6c8f2 }
  - { name: taramanji/inquiry, newName: ghcr.io/javalangruntimeexception/taramanji-inquiry, newTag: sha-bb6c8f2 }
  - { name: taramanji/reservation, newName: ghcr.io/javalangruntimeexception/taramanji-reservation, newTag: sha-bb6c8f2 }
  - { name: taramanji/worklocation, newName: ghcr.io/javalangruntimeexception/taramanji-worklocation, newTag: sha-bb6c8f2 }
  - { name: taramanji/content, newName: ghcr.io/javalangruntimeexception/taramanji-content, newTag: sha-bb6c8f2 }
  - { name: taramanji/calendarsync, newName: ghcr.io/javalangruntimeexception/taramanji-calendarsync, newTag: sha-bb6c8f2 }
  - { name: taramanji/analytics, newName: ghcr.io/javalangruntimeexception/taramanji-analytics, newTag: sha-bb6c8f2 }
  - { name: taramanji/web, newName: ghcr.io/javalangruntimeexception/taramanji-web, newTag: sha-bb6c8f2 }

patches:
  - target: { kind: Deployment }
    patch: |-
      - op: replace
        path: /spec/template/metadata/labels/tags.datadoghq.com~1env
        value: dev02
  # Go サービスの APP_ENV（web は nginx なので除く）
  - target: { kind: Deployment, labelSelector: "app.kubernetes.io/name!=web" }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: any }
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - { name: APP_ENV, value: dev }
  - target: { kind: StatefulSet }
    patch: |-
      - op: replace
        path: /spec/template/metadata/labels/tags.datadoghq.com~1service
        value: redis-dev02
  # ホスト名と転送先
  - target: { kind: HTTPRoute, labelSelector: "taramanji.com/host-group=site" }
    patch: |-
      - op: replace
        path: /spec/hostnames
        value: ["dev02.taramanji.com"]
  - target: { kind: HTTPRoute, labelSelector: "taramanji.com/host-group=gws" }
    patch: |-
      - op: replace
        path: /spec/hostnames
        value: ["dev02-gws.taramanji.com"]
  - target: { kind: HTTPRoute, name: site-redirects }
    patch: |-
      - op: replace
        path: /spec/rules/0/filters/0/requestRedirect/hostname
        value: dev02-gws.taramanji.com
  - target: { kind: HTTPRoute, name: gws-redirects }
    patch: |-
      - op: replace
        path: /spec/rules/0/filters/0/requestRedirect/hostname
        value: dev02.taramanji.com
  # ログインを受けるホストと、カレンダー同期の戻り先
  # 名前で書き換える（番号で指すと、env を足したときに別の項目を上書きしてしまう）
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: identity }
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - { name: LOGIN_HOSTS, value: "dev02.taramanji.com,dev02-gws.taramanji.com" }
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: calendarsync }
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - { name: AUTH_URL, value: "https://dev02-gws.taramanji.com" }

# 各サービスの版（Datadog の version タグ）は、そのサービスのイメージのタグから取る。
# 変わったサービスだけ images の newTag を書き換えれば、そのサービスだけが入れ替わる
replacements:
  - source: { kind: Deployment, name: identity, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: identity }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
  - source: { kind: Deployment, name: notification, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: notification }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
  - source: { kind: Deployment, name: inquiry, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: inquiry }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
  - source: { kind: Deployment, name: reservation, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: reservation }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
  - source: { kind: Deployment, name: worklocation, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: worklocation }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
  - source: { kind: Deployment, name: content, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: content }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
  - source: { kind: Deployment, name: calendarsync, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: calendarsync }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
  - source: { kind: Deployment, name: analytics, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: analytics }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
  - source: { kind: Deployment, name: web, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: web }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
