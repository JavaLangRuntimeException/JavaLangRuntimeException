# stg（同じ kind の taramanji-stg namespace）。main への push（と手動実行）で CI が版を書き換え、Argo CD が同期する。
# 本番に出す直前の版（main の最新）を、本番と同じイメージで確かめる場所。本番は stg で確かめたコミットにタグを打って出す。
# 本番との違い: 1 台ずつ・HPA/PDB なし・カナリアなし・ホスト名 stg.taramanji.com / stg-gws.taramanji.com（Cloudflare Access で本人だけ）・Redis も同じ namespace
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taramanji-stg
resources:
  - namespace.yaml
  - ../../base/apps
  - ../../base/data
  - ../../base/routes
  - sealed

# set-version.sh が書き換える（CI の deploy-stg ジョブ）
images:
  - { name: taramanji/identity, newName: ghcr.io/javalangruntimeexception/taramanji-identity, newTag: sha-441178a }
  - { name: taramanji/notification, newName: ghcr.io/javalangruntimeexception/taramanji-notification, newTag: sha-441178a }
  - { name: taramanji/inquiry, newName: ghcr.io/javalangruntimeexception/taramanji-inquiry, newTag: sha-441178a }
  - { name: taramanji/reservation, newName: ghcr.io/javalangruntimeexception/taramanji-reservation, newTag: sha-441178a }
  - { name: taramanji/worklocation, newName: ghcr.io/javalangruntimeexception/taramanji-worklocation, newTag: sha-441178a }
  - { name: taramanji/content, newName: ghcr.io/javalangruntimeexception/taramanji-content, newTag: sha-441178a }
  - { name: taramanji/calendarsync, newName: ghcr.io/javalangruntimeexception/taramanji-calendarsync, newTag: sha-441178a }
  - { name: taramanji/analytics, newName: ghcr.io/javalangruntimeexception/taramanji-analytics, newTag: sha-441178a }
  - { name: taramanji/web, newName: ghcr.io/javalangruntimeexception/taramanji-web, newTag: sha-441178a }

patches:
  - path: version.yaml
    target: { kind: Deployment }
  - target: { kind: Deployment }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/metadata/labels/tags.datadoghq.com~1env
        value: stg
  # Go サービスの APP_ENV（web は nginx なので除く。Go 側が受け付ける値は local / dev / staging / prod）
  - target: { kind: Deployment, labelSelector: "app.kubernetes.io/name!=web" }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: any }
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - { name: APP_ENV, value: staging }
  - target: { kind: StatefulSet }
    patch: |-
      - op: replace
        path: /spec/template/metadata/labels/tags.datadoghq.com~1service
        value: redis-stg
  # 1 台なので PDB は外す（drain を止めないため）。台数も固定
  - target: { kind: PodDisruptionBudget }
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata: { name: any }
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata: { name: any }
  # stg の同期は手動で試すときだけ（実在のカレンダーを書き換えないよう CronJob は止めておく）
  - target: { kind: CronJob }
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
  # ホスト名と転送先
  - target: { kind: HTTPRoute, labelSelector: "taramanji.com/host-group=site" }
    patch: |-
      - op: replace
        path: /spec/hostnames
        value: ["stg.taramanji.com"]
  - target: { kind: HTTPRoute, labelSelector: "taramanji.com/host-group=gws" }
    patch: |-
      - op: replace
        path: /spec/hostnames
        value: ["stg-gws.taramanji.com"]
  - target: { kind: HTTPRoute, name: site-redirects }
    patch: |-
      - op: replace
        path: /spec/rules/0/filters/0/requestRedirect/hostname
        value: stg-gws.taramanji.com
  - target: { kind: HTTPRoute, name: gws-redirects }
    patch: |-
      - op: replace
        path: /spec/rules/0/filters/0/requestRedirect/hostname
        value: stg.taramanji.com
  # ログインを受けるホストと、カレンダー同期の戻り先
  # 名前で書き換える（番号で指すと、env を足したときに別の項目を上書きしてしまう）
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: identity }
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - { name: LOGIN_HOSTS, value: "stg.taramanji.com,stg-gws.taramanji.com" }
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: calendarsync }
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - { name: AUTH_URL, value: "https://stg-gws.taramanji.com" }
