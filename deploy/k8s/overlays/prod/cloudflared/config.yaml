# Cloudflare Tunnel のルーティング。ホスト名の振り分けは Gateway（HTTPRoute）でするので、ここではすべて Gateway へ送る。
# Host ヘッダーは元のまま（taramanji.com / gws.taramanji.com）届く
credentials-file: /etc/cloudflared/creds/credentials.json
metrics: 0.0.0.0:2000
no-autoupdate: true
ingress:
  - service: http://taramanji-gateway.envoy-gateway-system.svc.cluster.local:80
