# 本番のカナリア（Argo Rollouts）。Deployment はそのまま（workloadRef）で、Pod の入れ替えを Rollout が行う。
#   10% で止まって手動の promote を待ち、そのあと 25% → 50% → 100%（各 5 分）。web だけは新旧を混ぜず一度に切り替える。
#   その間ずっと Datadog で新しい版の 5xx 率と p95 を見て、悪ければ自動で元に戻す（10% で待っている間も）。
# 公開しているサービスは HTTPRoute の重み（Gateway API プラグイン）、notification（内部専用）は Pod の数の比で流す。
# version の値は deploy/k8s/scripts/set-version.sh がリリースごとに書き換える
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: identity
    scaleDown: progressively
  strategy:
    canary:
      canaryService: identity-canary
      stableService: identity
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            namespace: taramanji
            httpRoutes:
            - name: identity-site
            - name: identity-gws
      maxSurge: 1
      maxUnavailable: 0
      analysis:
        templates:
          - clusterScope: true
            templateName: canary-health
        startingStep: 1
        args:
          - name: service
            value: identity
          - name: version
            value: v0.1.4
      steps:
        - setWeight: 10
        - pause: {}               # 10% で止まり、promote されるまで待つ（その間も Datadog の判定は続く）
        - setWeight: 25
        - pause: { duration: 5m }
        - setWeight: 50
        - pause: { duration: 5m }
