# 本番のアプリ（namespace: taramanji）。base に Argo Rollouts（カナリア）と本番のホスト名・イメージを足す
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taramanji
resources:
  - ../../../base/apps
  - ../../../base/routes
  - rollouts.yaml
  - analysis.yaml

# set-version.sh が書き換える（CI の「リリース」ジョブ）
images:
  - { name: taramanji/identity, newName: ghcr.io/javalangruntimeexception/taramanji-identity, newTag: v0.1.6 }
  - { name: taramanji/notification, newName: ghcr.io/javalangruntimeexception/taramanji-notification, newTag: v0.1.6 }
  - { name: taramanji/inquiry, newName: ghcr.io/javalangruntimeexception/taramanji-inquiry, newTag: v0.1.6 }
  - { name: taramanji/reservation, newName: ghcr.io/javalangruntimeexception/taramanji-reservation, newTag: v0.1.6 }
  - { name: taramanji/worklocation, newName: ghcr.io/javalangruntimeexception/taramanji-worklocation, newTag: v0.1.6 }
  - { name: taramanji/content, newName: ghcr.io/javalangruntimeexception/taramanji-content, newTag: v0.1.6 }
  - { name: taramanji/calendarsync, newName: ghcr.io/javalangruntimeexception/taramanji-calendarsync, newTag: v0.1.6 }
  - { name: taramanji/analytics, newName: ghcr.io/javalangruntimeexception/taramanji-analytics, newTag: v0.1.6 }
  - { name: taramanji/web, newName: ghcr.io/javalangruntimeexception/taramanji-web, newTag: v0.1.6 }

patches:
  # Pod は Rollout が持つので、Deployment 自体は 0 台（workloadRef の作法）
  - target: { kind: Deployment }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # HPA は Rollout の台数を増減させる
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      - op: replace
        path: /spec/scaleTargetRef
        value: { apiVersion: argoproj.io/v1alpha1, kind: Rollout, name: PLACEHOLDER }
  - target: { kind: HorizontalPodAutoscaler, name: web }
    patch: |-
      - op: replace
        path: /spec/scaleTargetRef/name
        value: web
  - target: { kind: HorizontalPodAutoscaler, name: reservation }
    patch: |-
      - op: replace
        path: /spec/scaleTargetRef/name
        value: reservation
  - target: { kind: HorizontalPodAutoscaler, name: content }
    patch: |-
      - op: replace
        path: /spec/scaleTargetRef/name
        value: content
  # 本番のホスト名
  - target: { kind: HTTPRoute, labelSelector: "taramanji.com/host-group=site" }
    patch: |-
      - op: replace
        path: /spec/hostnames
        value: ["taramanji.com", "www.taramanji.com"]

# 各サービスの版（Datadog の version タグ）は、そのサービスのイメージのタグから取る。
# 変わったサービスだけ images の newTag を書き換えれば、そのサービスだけが入れ替わる（カナリアの判定に渡す version も同じ）
replacements:
  - source: { kind: Deployment, name: identity, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: identity }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
      - select: { kind: Rollout, name: identity }
        fieldPaths: ["spec.strategy.canary.analysis.args.[name=version].value"]
  - source: { kind: Deployment, name: notification, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: notification }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
      - select: { kind: Rollout, name: notification }
        fieldPaths: ["spec.strategy.canary.analysis.args.[name=version].value"]
  - source: { kind: Deployment, name: inquiry, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: inquiry }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
      - select: { kind: Rollout, name: inquiry }
        fieldPaths: ["spec.strategy.canary.analysis.args.[name=version].value"]
  - source: { kind: Deployment, name: reservation, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: reservation }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
      - select: { kind: Rollout, name: reservation }
        fieldPaths: ["spec.strategy.canary.analysis.args.[name=version].value"]
  - source: { kind: Deployment, name: worklocation, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: worklocation }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
      - select: { kind: Rollout, name: worklocation }
        fieldPaths: ["spec.strategy.canary.analysis.args.[name=version].value"]
  - source: { kind: Deployment, name: content, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: content }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
      - select: { kind: Rollout, name: content }
        fieldPaths: ["spec.strategy.canary.analysis.args.[name=version].value"]
  - source: { kind: Deployment, name: calendarsync, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: calendarsync }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
      - select: { kind: Rollout, name: calendarsync }
        fieldPaths: ["spec.strategy.canary.analysis.args.[name=version].value"]
  - source: { kind: Deployment, name: analytics, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: analytics }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
      - select: { kind: Rollout, name: analytics }
        fieldPaths: ["spec.strategy.canary.analysis.args.[name=version].value"]
  - source: { kind: Deployment, name: web, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: web }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
