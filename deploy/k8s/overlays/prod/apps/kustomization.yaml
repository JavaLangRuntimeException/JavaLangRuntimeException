# 本番のアプリ（namespace: taramanji）。base に Argo Rollouts（カナリア）と本番のホスト名・イメージを足す
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taramanji
resources:
  - ../../../base/apps
  - ../../../base/routes
  - rollouts.yaml
  - analysis.yaml

# set-version.sh が書き換える（CI の「リリース」ジョブ）
images:
  - { name: taramanji/identity, newName: ghcr.io/javalangruntimeexception/taramanji-identity, newTag: v0.1.2 }
  - { name: taramanji/notification, newName: ghcr.io/javalangruntimeexception/taramanji-notification, newTag: v0.1.2 }
  - { name: taramanji/inquiry, newName: ghcr.io/javalangruntimeexception/taramanji-inquiry, newTag: v0.1.2 }
  - { name: taramanji/reservation, newName: ghcr.io/javalangruntimeexception/taramanji-reservation, newTag: v0.1.2 }
  - { name: taramanji/worklocation, newName: ghcr.io/javalangruntimeexception/taramanji-worklocation, newTag: v0.1.2 }
  - { name: taramanji/content, newName: ghcr.io/javalangruntimeexception/taramanji-content, newTag: v0.1.2 }
  - { name: taramanji/calendarsync, newName: ghcr.io/javalangruntimeexception/taramanji-calendarsync, newTag: v0.1.2 }
  - { name: taramanji/analytics, newName: ghcr.io/javalangruntimeexception/taramanji-analytics, newTag: v0.1.2 }
  - { name: taramanji/web, newName: ghcr.io/javalangruntimeexception/taramanji-web, newTag: v0.1.2 }

patches:
  # Pod の版（Datadog の version タグ。カナリアの判定もこれで新旧を分ける）
  - path: version.yaml
    target: { kind: Deployment }
  # Pod は Rollout が持つので、Deployment 自体は 0 台（workloadRef の作法）
  - target: { kind: Deployment }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # HPA は Rollout の台数を増減させる
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      - op: replace
        path: /spec/scaleTargetRef
        value: { apiVersion: argoproj.io/v1alpha1, kind: Rollout, name: PLACEHOLDER }
  - target: { kind: HorizontalPodAutoscaler, name: web }
    patch: |-
      - op: replace
        path: /spec/scaleTargetRef/name
        value: web
  - target: { kind: HorizontalPodAutoscaler, name: reservation }
    patch: |-
      - op: replace
        path: /spec/scaleTargetRef/name
        value: reservation
  - target: { kind: HorizontalPodAutoscaler, name: content }
    patch: |-
      - op: replace
        path: /spec/scaleTargetRef/name
        value: content
  # 本番のホスト名
  - target: { kind: HTTPRoute, labelSelector: "taramanji.com/host-group=site" }
    patch: |-
      - op: replace
        path: /spec/hostnames
        value: ["taramanji.com", "www.taramanji.com"]
