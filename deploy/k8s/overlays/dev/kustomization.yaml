# dev（同じ kind の taramanji-dev namespace）。main にマージすると CI がタグを書き換え、Argo CD が同期する。
# 本番との違い: 1 台ずつ・HPA/PDB なし・カナリアなし・ホスト名 dev.taramanji.com / dev-gws.taramanji.com（Cloudflare Access で本人だけ）・Redis も同じ namespace
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taramanji-dev
resources:
  - namespace.yaml
  - ../../base/apps
  - ../../base/data
  - ../../base/routes
  - sealed

# set-version.sh が書き換える（CI の「dev へデプロイ」ジョブ）
images:
  - { name: taramanji/identity, newName: ghcr.io/javalangruntimeexception/taramanji-identity, newTag: bootstrap }
  - { name: taramanji/notification, newName: ghcr.io/javalangruntimeexception/taramanji-notification, newTag: bootstrap }
  - { name: taramanji/inquiry, newName: ghcr.io/javalangruntimeexception/taramanji-inquiry, newTag: bootstrap }
  - { name: taramanji/reservation, newName: ghcr.io/javalangruntimeexception/taramanji-reservation, newTag: bootstrap }
  - { name: taramanji/worklocation, newName: ghcr.io/javalangruntimeexception/taramanji-worklocation, newTag: bootstrap }
  - { name: taramanji/content, newName: ghcr.io/javalangruntimeexception/taramanji-content, newTag: bootstrap }
  - { name: taramanji/calendarsync, newName: ghcr.io/javalangruntimeexception/taramanji-calendarsync, newTag: bootstrap }
  - { name: taramanji/analytics, newName: ghcr.io/javalangruntimeexception/taramanji-analytics, newTag: bootstrap }
  - { name: taramanji/web, newName: ghcr.io/javalangruntimeexception/taramanji-web, newTag: bootstrap }

patches:
  - path: version.yaml
    target: { kind: Deployment }
  - target: { kind: Deployment }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/metadata/labels/tags.datadoghq.com~1env
        value: dev
  # Go サービスの APP_ENV（web は nginx なので除く）
  - target: { kind: Deployment, labelSelector: "app.kubernetes.io/name!=web" }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: dev
  - target: { kind: StatefulSet }
    patch: |-
      - op: replace
        path: /spec/template/metadata/labels/tags.datadoghq.com~1service
        value: redis-dev
  # 1 台なので PDB は外す（drain を止めないため）。台数も固定
  - target: { kind: PodDisruptionBudget }
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata: { name: any }
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata: { name: any }
  # dev の同期は手動で試すときだけ（実在のカレンダーを書き換えないよう CronJob は止めておく）
  - target: { kind: CronJob }
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
  # ホスト名と転送先
  - target: { kind: HTTPRoute, labelSelector: "taramanji.com/host-group=site" }
    patch: |-
      - op: replace
        path: /spec/hostnames
        value: ["dev.taramanji.com"]
  - target: { kind: HTTPRoute, labelSelector: "taramanji.com/host-group=gws" }
    patch: |-
      - op: replace
        path: /spec/hostnames
        value: ["dev-gws.taramanji.com"]
  - target: { kind: HTTPRoute, name: site-redirects }
    patch: |-
      - op: replace
        path: /spec/rules/0/filters/0/requestRedirect/hostname
        value: dev-gws.taramanji.com
  - target: { kind: HTTPRoute, name: gws-redirects }
    patch: |-
      - op: replace
        path: /spec/rules/0/filters/0/requestRedirect/hostname
        value: dev.taramanji.com
  # ログインを受けるホストと、カレンダー同期の戻り先
  - target: { kind: Deployment, name: identity }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/9/value
        value: dev.taramanji.com,dev-gws.taramanji.com
  - target: { kind: Deployment, name: calendarsync }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/9/value
        value: https://dev-gws.taramanji.com
