# Certificate Manager のマネージド証明書は gcloud で作る（Terraform 推奨）:
#   gcloud certificate-manager certificates create taramanji --domains=taramanji.com,www.taramanji.com,gws.taramanji.com
#   gcloud certificate-manager maps create taramanji-certmap
#   gcloud certificate-manager maps entries create taramanji --map=taramanji-certmap --certificates=taramanji --hostname=taramanji.com
# HTTP は HTTPS へ転送する
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
spec:
  parentRefs:
    - { name: taramanji, namespace: gateway, sectionName: http }
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
