# dev01〜03・stg の共通部分（本番との違い）。各環境の overlay が components で読み込む。
#   1 台ずつ・HPA/PDB なし・カナリアなし（Rollout は 1 台ずつ入れ替えるだけ）・カレンダー同期の CronJob は止める
# namespace・ホスト名・イメージの版・version ラベル（replacements）は各 overlay で決める
# （replacements は overlay の images より後に効かせたいので、ここには置けない）
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - rollouts.yaml
patches:
  # Pod は Rollout が持つので、Deployment 自体は 0 台（workloadRef の作法。本番と同じ）
  - target: { kind: Deployment }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # 1 台なので PDB は外す（drain を止めないため）。台数も固定
  - target: { kind: PodDisruptionBudget }
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata: { name: any }
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata: { name: any }
  # 同期は手動で試すときだけ（実在のカレンダーを書き換えないよう CronJob は止めておく）
  - target: { kind: CronJob }
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
