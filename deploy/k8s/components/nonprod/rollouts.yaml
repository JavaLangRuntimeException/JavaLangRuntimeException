# dev01〜03・stg の Rollout。Deployment はそのまま（workloadRef）で、Pod を Argo Rollouts が持つ。
# カナリアの段や Datadog の判定はなく、1 台ずつ入れ替えるだけ（Deployment の RollingUpdate と同じ動き）。
# Rollouts の画面（rollouts.taramanji.com）で、各環境に出ている版と入れ替えの様子を本番と同じように見るため
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: identity
    scaleDown: onsuccess
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
