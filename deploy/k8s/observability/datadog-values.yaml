# Datadog Agent（Helm: datadog/datadog）を kind に入れる設定。install-datadog.sh から使う。
# GKE でもほぼ同じ（GKE Autopilot なら providers.gke.autopilot: true を足す）
datadog:
  apiKeyExistingSecret: datadog-secret
  site: us5.datadoghq.com
  clusterName: taramanji-kind
  tags:
    - env:prod
    - host_type:mac-mini
    - cluster_type:kind
  # kind の kubelet は自己署名証明書
  kubelet:
    tlsVerify: false
  logs:
    enabled: true
    containerCollectAll: true
  # kind の内部（kube-system・local-path-storage）と dev・stg のコンテナは監視しない（コンテナ数の課金を減らす）。
  # taramanji cloud も本番（cloud）だけ監視し、cloud-dev・cloud-stg は監視しない（コンソールのメトリクスも本番だけ）。
  # dev・stg のトレース（APM）はノードの 8126 に送られるので、今までどおり届く
  containerExclude: "kube_namespace:^kube-system$ kube_namespace:^local-path-storage$ kube_namespace:^taramanji-dev[0-9]*$ kube_namespace:^taramanji-stg$ kube_namespace:^cloud-dev(-apps)?$ kube_namespace:^cloud-stg(-apps)?$"
  # ログは本番のアプリ（taramanji）・cloudflared・Redis と、Envoy Gateway のアクセスログ（全環境の HTTP リクエスト 1 件ずつ。
  # 利用者の IP は Cf-Connecting-Ip から client_ip に入る。log_pipelines.py で標準属性に直す）だけ送る。
  # kindnet・Argo・Datadog 自身などの基盤のログは量が多いわりに見ないので送らない（kubectl logs で見る）。include が exclude より優先
  containerExcludeLogs: "kube_namespace:.*"
  # taramanji cloud の本番（cloud・アプリ用の cloud-apps）とそのトンネル（cloud-cloudflared）も送る
  containerIncludeLogs: "kube_namespace:^taramanji$ kube_namespace:^cloudflared$ kube_namespace:^data$ name:^envoy$ kube_namespace:^cloud(-apps)?$ kube_namespace:^cloud-cloudflared$"
  # APM: アプリ（dd-trace-go）はノードの IP の 8126 へ送る
  apm:
    portEnabled: true
    port: 8126
  # DogStatsD（業務メトリクス・ランタイムメトリクス）: ノードの IP の 8125/udp
  dogstatsd:
    useHostPort: true
    nonLocalTraffic: true
    originDetection: true
  kubeStateMetricsCore:
    enabled: true
  # Kubernetes のイベント（再起動・スケジュール失敗・Rollout など）
  collectEvents: true
  # クラスター全体で 1 回だけ動かすチェック（下の http_check）
  clusterChecks:
    enabled: true
  # ネットワークポリシー・HPA・PDB の状態も Datadog で見る
  orchestratorExplorer:
    enabled: true
  processAgent:
    processCollection: false
  # Envoy・Redis・cloudflared のチェックは Pod の注釈（Autodiscovery）で設定している
clusterAgent:
  enabled: true
  # 外から見た死活とレイテンシ（Cloudflare 経由で本番の URL を叩く）。クラスターで 1 回だけ動く
  confd:
    http_check.yaml: |-
      cluster_check: true
      init_config:
      instances:
        - { name: taramanji.com, url: "https://taramanji.com/", timeout: 10, tags: ["site:taramanji.com"] }
        # 管理画面は Cloudflare Access の後ろ。ログイン画面へ飛ばされる（302）ことを確かめる（Access が外れたら気づける）
        - { name: gws.taramanji.com, url: "https://gws.taramanji.com/admin", timeout: 10, allow_redirects: false, http_response_status_code: "302", tags: ["site:gws.taramanji.com"] }
        - { name: taramanji.com/blogs, url: "https://taramanji.com/blogs", timeout: 10, tags: ["site:taramanji.com"] }
  metricsProvider:
    enabled: false
agents:
  containers:
    agent:
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 512Mi }
    traceAgent:
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits: { memory: 256Mi }
