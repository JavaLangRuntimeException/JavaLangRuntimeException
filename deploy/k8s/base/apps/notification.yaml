# notification: メール送信（SES）。内部 gRPC のみ
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: taramanji
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: notification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification
        app.kubernetes.io/part-of: taramanji
        tags.datadoghq.com/env: prod
        tags.datadoghq.com/service: notification
      annotations:
        ad.datadoghq.com/app.logs: '[{"source":"go","service":"notification"}]'
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      # 2 台のワーカー（別ゾーン扱い）に散らす。1 台を drain してもサービスは止まらない
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector: { matchLabels: { app.kubernetes.io/name: notification } }
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector: { matchLabels: { app.kubernetes.io/name: notification } }
      containers:
        - name: app
          image: taramanji/notification
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: APP_ENV, value: prod }
            - { name: PORT, value: ":8080" }
            # Datadog Agent はノードごと（DaemonSet）。APM と DogStatsD はノードの IP へ送る
            - name: DD_AGENT_HOST
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: DD_ENV
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['tags.datadoghq.com/env']" } }
            - name: DD_SERVICE
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['tags.datadoghq.com/service']" } }
            - name: DD_VERSION
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['tags.datadoghq.com/version']" } }
            - { name: DD_LOGS_INJECTION, value: "true" }
            - { name: DD_RUNTIME_METRICS_ENABLED, value: "true" }
            # span の名前を「受けた（http.server.request）」と「送った（http.client.request）」で分ける。
            # 分けないと外部 API（iCal など）の失敗が自分のエラー率に混ざり、カナリアの判定を誤らせる
            - { name: DD_TRACE_SPAN_ATTRIBUTE_SCHEMA, value: v1 }
            # GC をメモリ上限に合わせる（OOMKill の前に GC が頑張る）
            - name: GOMEMLIMIT
              valueFrom: { resourceFieldRef: { resource: limits.memory } }
          envFrom:
            - secretRef: { name: notification-env }
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  labels:
    app.kubernetes.io/name: notification
spec:
  selector:
    app.kubernetes.io/name: notification
  ports:
    - name: http
      port: 8080
      targetPort: http
      # Envoy から h2c（HTTP/2 平文）でつなぐ。gRPC もそのまま通る
      appProtocol: kubernetes.io/h2c
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notification
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification
