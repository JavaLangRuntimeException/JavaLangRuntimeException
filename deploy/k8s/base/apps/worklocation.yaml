# worklocation: 勤務場所
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worklocation
  labels:
    app.kubernetes.io/name: worklocation
    app.kubernetes.io/part-of: taramanji
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: worklocation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worklocation
        app.kubernetes.io/part-of: taramanji
        tags.datadoghq.com/env: prod
        tags.datadoghq.com/service: worklocation
        taramanji.com/redis-client: "true"
        taramanji.com/public: "true"
      annotations:
        ad.datadoghq.com/app.logs: '[{"source":"go","service":"worklocation"}]'
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      # 2 台のワーカー（別ゾーン扱い）に散らす。1 台を drain してもサービスは止まらない
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector: { matchLabels: { app.kubernetes.io/name: worklocation } }
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector: { matchLabels: { app.kubernetes.io/name: worklocation } }
      containers:
        - name: app
          image: taramanji/worklocation
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: APP_ENV, value: prod }
            - { name: PORT, value: ":8080" }
            # Datadog Agent はノードごと（DaemonSet）。APM と DogStatsD はノードの IP へ送る
            - name: DD_AGENT_HOST
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: DD_ENV
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['tags.datadoghq.com/env']" } }
            - name: DD_SERVICE
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['tags.datadoghq.com/service']" } }
            - name: DD_VERSION
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['tags.datadoghq.com/version']" } }
            - { name: DD_LOGS_INJECTION, value: "true" }
            - { name: DD_RUNTIME_METRICS_ENABLED, value: "true" }
            # GC をメモリ上限に合わせる（OOMKill の前に GC が頑張る）
            - name: GOMEMLIMIT
              valueFrom: { resourceFieldRef: { resource: limits.memory } }
          envFrom:
            - secretRef: { name: worklocation-env }
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: worklocation
  labels:
    app.kubernetes.io/name: worklocation
spec:
  selector:
    app.kubernetes.io/name: worklocation
  ports:
    - name: http
      port: 8080
      targetPort: http
      # Envoy から h2c（HTTP/2 平文）でつなぐ。gRPC もそのまま通る
      appProtocol: kubernetes.io/h2c
---
# カナリア（新しい版）用。本番のリリース中だけ Argo Rollouts が新しい Pod に向け、HTTPRoute の重みで少しずつ流す
apiVersion: v1
kind: Service
metadata:
  name: worklocation-canary
  labels:
    app.kubernetes.io/name: worklocation
spec:
  selector:
    app.kubernetes.io/name: worklocation
  ports:
    - name: http
      port: 8080
      targetPort: http
      # Envoy から h2c（HTTP/2 平文）でつなぐ。gRPC もそのまま通る
      appProtocol: kubernetes.io/h2c
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worklocation
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worklocation
