# worklocation: 勤務場所
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: worklocation
  labels:
    taramanji.com/host-group: site
spec:
  parentRefs:
    - { name: taramanji, namespace: gateway, sectionName: http }
  # 環境ごとのホスト名はオーバーレイで差し替える
  hostnames: ["taramanji.com", "www.taramanji.com"]
  rules:
    - matches:
        - { path: { type: PathPrefix, value: /taramanji.worklocation.v1.WorkLocationService/ } }
      backendRefs:
        - { name: worklocation, port: 8080, weight: 100 }
        - { name: worklocation-canary, port: 8080, weight: 0 }
