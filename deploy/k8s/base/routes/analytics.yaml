# analytics: ページビュー
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: analytics
  labels:
    taramanji.com/host-group: site
spec:
  parentRefs:
    - { name: taramanji, namespace: gateway, sectionName: http }
  # 環境ごとのホスト名はオーバーレイで差し替える
  hostnames: ["taramanji.com", "www.taramanji.com"]
  rules:
    - matches:
        - { path: { type: Exact, value: /api/metrics/pageview } }
      backendRefs:
        - { name: analytics, port: 8080, weight: 100 }
        - { name: analytics-canary, port: 8080, weight: 0 }
