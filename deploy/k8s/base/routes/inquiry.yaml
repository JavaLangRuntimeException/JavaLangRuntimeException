# inquiry: お問い合わせ・アンケート（添付があるので長め）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inquiry
  labels:
    taramanji.com/host-group: site
spec:
  parentRefs:
    - { name: taramanji, namespace: gateway, sectionName: http }
  # 環境ごとのホスト名はオーバーレイで差し替える
  hostnames: ["taramanji.com", "www.taramanji.com"]
  rules:
    - matches:
        - { path: { type: PathPrefix, value: /taramanji.inquiry.v1.InquiryService/ } }
      backendRefs:
        - { name: inquiry, port: 8080, weight: 100 }
        - { name: inquiry-canary, port: 8080, weight: 0 }
      timeouts: { request: 60s }
