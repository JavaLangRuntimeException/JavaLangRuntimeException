# web: サイト全体（他のルートに当たらないパスはすべて SPA）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-site
  labels:
    taramanji.com/host-group: site
spec:
  parentRefs:
    - { name: taramanji, namespace: gateway, sectionName: http }
  # 環境ごとのホスト名はオーバーレイで差し替える
  hostnames: ["taramanji.com", "www.taramanji.com"]
  rules:
    - matches:
        - { path: { type: PathPrefix, value: / } }
      backendRefs:
        - { name: web, port: 8080, weight: 100 }
        - { name: web-canary, port: 8080, weight: 0 }
