# web（gws 側）: 管理画面と、その表示に要る静的ファイルだけ
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-gws
  labels:
    taramanji.com/host-group: gws
spec:
  parentRefs:
    - { name: taramanji, namespace: gateway, sectionName: http }
  # 環境ごとのホスト名はオーバーレイで差し替える
  hostnames: ["gws.taramanji.com"]
  rules:
    - matches:
        - { path: { type: PathPrefix, value: /admin } }
        - { path: { type: PathPrefix, value: /assets/ } }
        - { path: { type: Exact, value: /favicon.ico } }
        - { path: { type: Exact, value: /image.ico } }
      backendRefs:
        - { name: web, port: 8080, weight: 100 }
        - { name: web-canary, port: 8080, weight: 0 }
