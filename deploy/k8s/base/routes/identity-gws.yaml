# identity（gws 側。カレンダー同期の管理画面のログイン）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: identity-gws
  labels:
    taramanji.com/host-group: gws
spec:
  parentRefs:
    - { name: taramanji, namespace: gateway, sectionName: http }
  # 環境ごとのホスト名はオーバーレイで差し替える
  hostnames: ["gws.taramanji.com"]
  rules:
    - matches:
        - { path: { type: PathPrefix, value: /taramanji.identity.v1.IdentityService/ } }
        - { path: { type: PathPrefix, value: /api/auth/ } }
      backendRefs:
        - { name: identity, port: 8080, weight: 100 }
        - { name: identity-canary, port: 8080, weight: 0 }
