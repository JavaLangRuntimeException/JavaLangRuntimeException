# calendarsync: カレンダー同期（gws.taramanji.com だけ）。「今すぐ同期」は最大 80 秒
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calendarsync
  labels:
    taramanji.com/host-group: gws
spec:
  parentRefs:
    - { name: taramanji, namespace: gateway, sectionName: http }
  # 環境ごとのホスト名はオーバーレイで差し替える
  hostnames: ["gws.taramanji.com"]
  rules:
    - matches:
        - { path: { type: PathPrefix, value: /taramanji.calendarsync.v1.CalendarSyncService/ } }
        - { path: { type: PathPrefix, value: /api/calendar-sync/ } }
      backendRefs:
        - { name: calendarsync, port: 8080, weight: 100 }
        - { name: calendarsync-canary, port: 8080, weight: 0 }
      timeouts: { request: 95s }
