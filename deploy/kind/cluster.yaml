# 本番クラスター（GKE に寄せた構成）: コントロールプレーン 1 + ワーカー 2
# データ（PV）は Mac 側の ~/taramanji-data に置き、クラスターを作り直しても残す
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: taramanji
nodes:
  - role: control-plane
    image: kindest/node:v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48
    labels:
      topology.kubernetes.io/zone: asia-northeast1-a
  - role: worker
    image: kindest/node:v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48
    labels:
      topology.kubernetes.io/zone: asia-northeast1-b
      cloud.google.com/gke-nodepool: default-pool
    extraMounts:
      - hostPath: /Users/taramanji_macmini/taramanji-data/worker
        containerPath: /var/local-path-provisioner
  - role: worker
    image: kindest/node:v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48
    labels:
      topology.kubernetes.io/zone: asia-northeast1-c
      cloud.google.com/gke-nodepool: default-pool
    extraMounts:
      - hostPath: /Users/taramanji_macmini/taramanji-data/worker2
        containerPath: /var/local-path-provisioner
