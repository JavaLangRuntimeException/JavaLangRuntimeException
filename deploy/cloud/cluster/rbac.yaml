# コンソールの API が Mac mini 全体の容量（ノードの容量と実際の使用量）を読む。読むだけ
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloud-api-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloud-api-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloud-api-nodes
subjects:
  - { kind: ServiceAccount, name: cloud-api, namespace: cloud }
  - { kind: ServiceAccount, name: cloud-api, namespace: cloud-stg }
  - { kind: ServiceAccount, name: cloud-api, namespace: cloud-dev }
