# 本番のコンソール（namespace: cloud）。メトリクス（Datadog）を出すのは本番だけ
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloud
resources:
  - ../../../base

# set-version.sh が書き換える（タグ v* の push で CI の deploy-prod ジョブ）。初回のリリースまでイメージはない
images:
  - { name: taramanji/cloud, newName: ghcr.io/javalangruntimeexception/taramanji-cloud, newTag: v0.2.12 }
  - { name: taramanji/console, newName: ghcr.io/javalangruntimeexception/taramanji-console, newTag: v0.2.12 }

patches:
  # 2 台にして、片方の入れ替え中・ノードの drain 中も止めない
  - target: { kind: Deployment, labelSelector: "app.kubernetes.io/name!=cloud-ctl" }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: cloud-api }
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  # コンソールのメトリクスで見る namespace（コンソール自身とアプリ用）
                  - { name: METRICS_NAMESPACES, value: "cloud,cloud-apps,cloud-fn-*" }
                  # 本番の関数の合計の枠（Mac mini のメモリから、taramanji.com・gws の伸びしろを残した分）
                  - { name: FUNCTION_MEMORY_CAP_MIB, value: "2560" }
                  - { name: FUNCTION_CPU_CAP_MILLIS, value: "4000" }
                  - { name: FUNCTION_POD_CAP, value: "30" }
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: cloud-gw }
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - { name: FUNCTION_MEMORY_CAP_MIB, value: "2560" }
                  # アプリの監視を Datadog のモニターにする（アプリケーションキーに monitors_read・monitors_write が要る）
                  - { name: ALERTS_ENABLED, value: "true" }

  # 本番のバケットの置き場（VM のディスクから取る。アプリ用 namespace の枠とは別）
  - target: { kind: StatefulSet, name: cloud-storage }
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 20Gi

  - target: { kind: StatefulSet, name: cloud-postgres }
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 10Gi

replacements:
  - source: { kind: Deployment, name: cloud-api, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: cloud-api }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
  - source: { kind: Deployment, name: cloud-gw, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: cloud-gw }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
  - source: { kind: StatefulSet, name: cloud-storage, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: StatefulSet, name: cloud-storage }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
  - source: { kind: Deployment, name: cloud-ctl, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: cloud-ctl }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
  - source: { kind: Deployment, name: console, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: console }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
