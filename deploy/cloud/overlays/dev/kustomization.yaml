# taramanji cloud の dev（cloud-dev.taramanji.com）。Argo CD の taramanji-cloud-dev がこのディレクトリを同期する
#   app/        コンソール（namespace: taramanji-cloud-dev）。CI が版を書き換える
#   sealed/     SealedSecret（scripts/seal.sh が作る）
#   アプリ（関数など）は本番だけ。stg・dev には置かない（components/nonprod）
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - app
  - sealed
