# taramanji cloud の dev（cloud-dev.taramanji.com、namespace: cloud-dev）。main への PR（と手動実行）。PR が複数あれば最後に出したもので CI が版を書き換え、Argo CD の cloud-dev が同期する。
# 本番との違い: 1 台ずつ・メトリクスなし（Datadog はこの namespace を集めない）・バケットとアプリの URL に -dev が付く
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloud-dev
resources:
  - ../../../base

# set-version.sh が書き換える（CI の deploy-dev ジョブ）
images:
  - { name: taramanji/cloud, newName: ghcr.io/javalangruntimeexception/taramanji-cloud, newTag: sha-38bce2b }
  - { name: taramanji/console, newName: ghcr.io/javalangruntimeexception/taramanji-console, newTag: sha-8c88bdf }

patches:
  - target: { kind: Deployment|StatefulSet, labelSelector: "app.kubernetes.io/name notin (cloud-postgres,cloud-redis)" }
    patch: |-
      - op: replace
        path: /spec/template/metadata/labels/tags.datadoghq.com~1env
        value: dev
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: cloud-api }
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - { name: APP_ENV, value: dev }
                  - { name: CLOUD_ENV, value: dev }
                  - { name: APPS_NAMESPACE, value: cloud-dev-apps }
                  - { name: CONSOLE_ORIGIN, value: "https://cloud-dev.taramanji.com" }
                  - { name: HOST_SUFFIX, value: "-cloud-dev.taramanji.com" }
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: cloud-gw }
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - { name: CLOUD_ENV, value: dev }
                  - { name: APP_ENV, value: dev }
                  - { name: APPS_NAMESPACE, value: cloud-dev-apps }
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: { name: cloud-storage }
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - { name: APP_ENV, value: dev }
                  - { name: APPS_NAMESPACE, value: cloud-dev-apps }
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: cloud-ctl }
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - { name: APP_ENV, value: dev }
                  - { name: APPS_NAMESPACE, value: cloud-dev-apps }
  - target: { kind: NetworkPolicy, name: to-cloud-storage }
    patch: |-
      - op: replace
        path: /spec/ingress/2/from/0/namespaceSelector/matchLabels/cloud.taramanji.com~1registry
        value: cloud-dev-apps
  - target: { kind: NetworkPolicy, name: to-cloud-data }
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/1/namespaceSelector/matchLabels/cloud.taramanji.com~1registry
        value: cloud-dev-apps
  - target: { kind: ReferenceGrant, name: apis-to-cloud-gw }
    patch: |-
      - op: replace
        path: /spec/from/0/namespace
        value: cloud-dev-apps
  - target: { kind: HTTPRoute, name: console }
    patch: |-
      - op: replace
        path: /spec/hostnames
        value: ["cloud-dev.taramanji.com"]

replacements:
  - source: { kind: Deployment, name: cloud-api, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: cloud-api }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
  - source: { kind: Deployment, name: cloud-gw, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: cloud-gw }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
  - source: { kind: StatefulSet, name: cloud-storage, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: StatefulSet, name: cloud-storage }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
  - source: { kind: Deployment, name: cloud-ctl, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: cloud-ctl }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
  - source: { kind: Deployment, name: console, fieldPath: "spec.template.spec.containers.0.image", options: { delimiter: ":", index: 1 } }
    targets:
      - select: { kind: Deployment, name: console }
        fieldPaths: ["spec.template.metadata.labels.[tags.datadoghq.com/version]"]
        options: { create: true }
