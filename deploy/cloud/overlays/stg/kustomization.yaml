# taramanji cloud の stg（cloud-stg.taramanji.com）。Argo CD の cloud-stg がこのディレクトリを同期する
#   app/        コンソール（namespace: cloud-stg）。CI が版を書き換える
#   workloads/  アプリ用 namespace（cloud-stg-apps）の枠と囲い
#   sealed/     SealedSecret（scripts/seal.sh が作る）
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - app
  - workloads
  - sealed
