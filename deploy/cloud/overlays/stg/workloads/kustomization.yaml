# stg のアプリの枠は小さく（workloads/quota.yaml の既定: メモリ 512 MiB・CPU 1・Pod 10・ディスク 10 GiB）
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloud-stg-apps
resources:
  - ../../../workloads
patches:
  - target: { kind: RoleBinding, name: cloud-api-capacity }
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: cloud-stg
  - target: { kind: RoleBinding, name: cloud-gw }
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: cloud-stg
  - target: { kind: NetworkPolicy, name: apps }
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: cloud-stg
  - target: { kind: RoleBinding, name: cloud-storage }
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: cloud-stg
