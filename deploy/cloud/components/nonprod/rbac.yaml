# stg・dev にはアプリ用の namespace がないので、APPS_NAMESPACE は自分の namespace にする。
# コンソールの API とストレージが、そこの定義（ラベル付きの ConfigMap。stg・dev では空）を読めるようにする
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloud-registry-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloud-registry-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloud-registry-reader
subjects:
  # namespace は overlay の namespace: で入る
  - { kind: ServiceAccount, name: cloud-api }
  - { kind: ServiceAccount, name: cloud-storage }
