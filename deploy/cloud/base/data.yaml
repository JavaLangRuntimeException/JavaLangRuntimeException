# マネージドデータベースの元になる、共有の PostgreSQL と Redis（環境ごとに 1 台ずつ）。
# コントローラー（cloud-ctl）が、データベースの定義（アプリ用 namespace の ConfigMap）に合わせて、ここからデータベースとユーザーを切り出す。
# 関数は自分のデータベース（PostgreSQL）・自分の接頭辞のキー（Redis）だけを触れる
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloud-postgres
  labels:
    app.kubernetes.io/name: cloud-postgres
    app.kubernetes.io/part-of: taramanji-cloud-data
spec:
  replicas: 1
  serviceName: cloud-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-postgres
        app.kubernetes.io/part-of: taramanji-cloud-data
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        # postgres のイメージ（alpine）の postgres ユーザー
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:17-alpine
          # メモリを小さく保つ（家の Mac mini で、ほかと分け合う）
          args: ["-c", "shared_buffers=32MB", "-c", "max_connections=50", "-c", "work_mem=2MB"]
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: cloud-data-admin, key: POSTGRES_ADMIN_PASSWORD } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"] }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-postgres
  labels:
    app.kubernetes.io/name: cloud-postgres
spec:
  selector:
    app.kubernetes.io/name: cloud-postgres
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloud-redis
  labels:
    app.kubernetes.io/name: cloud-redis
    app.kubernetes.io/part-of: taramanji-cloud-data
spec:
  replicas: 1
  serviceName: cloud-redis
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-redis
        app.kubernetes.io/part-of: taramanji-cloud-data
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # redis のイメージ（alpine）の redis ユーザー
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["sh", "-c"]
          # 満杯になったら古いキーを消さず、書き込みをエラーにする（データベースとして使うので、黙って消さない）。
          # ユーザー（ACL）はメモリにだけ置く。再起動したら、コントローラーが 20 秒以内に作り直す
          args:
            # パスワードの末尾の改行は落とす（Secret はファイルから作るので改行が付く。コントローラーも落として使う）
            - exec redis-server --requirepass "$(printf '%s' "$REDIS_ADMIN_PASSWORD" | tr -d '\r\n ')" --appendonly yes --dir /data --maxmemory 96mb --maxmemory-policy noeviction
          ports:
            - { name: redis, containerPort: 6379 }
          env:
            - name: REDIS_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: cloud-data-admin, key: REDIS_ADMIN_PASSWORD } }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-redis
  labels:
    app.kubernetes.io/name: cloud-redis
spec:
  selector:
    app.kubernetes.io/name: cloud-redis
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
# コントローラー（cloud-ctl）: cloud-api と同じイメージを CLOUD_MODE=controller で動かす。
# データベース・バケットの定義に合わせて、データベースを切り出し、接続先の Secret をアプリ用 namespace に作る
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-ctl
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-ctl
  labels:
    app.kubernetes.io/name: cloud-ctl
    app.kubernetes.io/part-of: taramanji-cloud-data
spec:
  # 2 台で同時にそろえても結果は同じだが、意味がないので 1 台
  replicas: 1
  revisionHistoryLimit: 5
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-ctl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-ctl
        app.kubernetes.io/part-of: taramanji-cloud-data
        tags.datadoghq.com/env: prod
        tags.datadoghq.com/service: cloud-ctl
      annotations:
        ad.datadoghq.com/app.logs: '[{"source":"go","service":"cloud-ctl"}]'
    spec:
      serviceAccountName: cloud-ctl
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: taramanji/cloud
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: CLOUD_MODE, value: controller }
            # 環境（関数ごとの namespace の名前 cloud-fn-<名前> などに使う）
            - { name: CLOUD_ENV, value: prod }
            # デプロイヤー: アプリ用のリポジトリの YAML を読んで入れる（Argo CD は使わない）。トークンがなければコントローラーだけ動く
            - { name: APPS_REPO, value: "JavaLangRuntimeException/taramanji-cloud-apps" }
            - name: APPS_REPO_TOKEN
              valueFrom: { secretKeyRef: { name: cloud-api-env, key: APPS_REPO_TOKEN, optional: true } }
            - { name: HOST_SUFFIX, value: "-cloud.taramanji.com" }
            - { name: APP_ENV, value: prod }
            - { name: PORT, value: ":8080" }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: DD_AGENT_HOST
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: DD_ENV
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['tags.datadoghq.com/env']" } }
            - name: DD_SERVICE
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['tags.datadoghq.com/service']" } }
            - name: DD_VERSION
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['tags.datadoghq.com/version']" } }
            - { name: DD_LOGS_INJECTION, value: "true" }
            - name: GOMEMLIMIT
              valueFrom: { resourceFieldRef: { resource: limits.memory } }
            - { name: APPS_NAMESPACE, value: cloud-apps }
            - name: STORAGE_MASTER_KEY
              valueFrom: { secretKeyRef: { name: cloud-storage-key, key: STORAGE_MASTER_KEY } }
          envFrom:
            - secretRef: { name: cloud-data-admin }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
