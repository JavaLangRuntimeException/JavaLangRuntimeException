# cloud-api: コンソールの API。自分の namespace の Deployment / StatefulSet を読むだけの ServiceAccount で動く
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-api
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloud-api
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloud-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloud-api
subjects:
  - kind: ServiceAccount
    name: cloud-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-api
  labels:
    app.kubernetes.io/name: cloud-api
    app.kubernetes.io/part-of: taramanji-cloud
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-api
        app.kubernetes.io/part-of: taramanji-cloud
        tags.datadoghq.com/env: prod
        tags.datadoghq.com/service: cloud-api
      annotations:
        ad.datadoghq.com/app.logs: '[{"source":"go","service":"cloud-api"}]'
    spec:
      serviceAccountName: cloud-api
      # Kubernetes API を読むのでトークンを入れる（Role は自分の namespace の読み取りだけ）
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: taramanji/cloud
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: APP_ENV, value: prod }
            - { name: PORT, value: ":8080" }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: DD_AGENT_HOST
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: DD_ENV
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['tags.datadoghq.com/env']" } }
            - name: DD_SERVICE
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['tags.datadoghq.com/service']" } }
            - name: DD_VERSION
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['tags.datadoghq.com/version']" } }
            - { name: DD_LOGS_INJECTION, value: "true" }
            - { name: DD_TRACE_SPAN_ATTRIBUTE_SCHEMA, value: v1 }
            - name: GOMEMLIMIT
              valueFrom: { resourceFieldRef: { resource: limits.memory } }
            # 環境ごとに overlays で書き換える
            - { name: CLOUD_ENV, value: prod }
            # この環境のアプリ用 namespace（容量の枠を読む）
            - { name: APPS_NAMESPACE, value: cloud-apps }
            # 環境の関数の合計の枠（コンソールの「容量」で数える。API Gateway の FUNCTION_MEMORY_CAP_MIB と同じ値にする）
            - { name: FUNCTION_MEMORY_CAP_MIB, value: "512" }
            - { name: FUNCTION_CPU_CAP_MILLIS, value: "1000" }
            - { name: FUNCTION_POD_CAP, value: "10" }
            - { name: CONSOLE_ORIGIN, value: "https://cloud.taramanji.com" }
            # 公開するホスト名は <名前> + これ（1 階層にして、Cloudflare の無料の証明書の範囲に収める）
            - { name: HOST_SUFFIX, value: "-cloud.taramanji.com" }
            - { name: FUNCTION_IDLE_TIMEOUT, value: 5m }
            # 共有の PostgreSQL / Redis とコントローラー（data.yaml）を入れてある
            - { name: DATABASES_ENABLED, value: "true" }
            # オブジェクトストレージの管理用のトークンを導くキー。なければバケットの中身は扱えない
            - name: STORAGE_MASTER_KEY
              valueFrom: { secretKeyRef: { name: cloud-storage-key, key: STORAGE_MASTER_KEY, optional: true } }
            # 公開ホスト名の DNS の自動登録（CF_DNS_API_TOKEN・CF_ZONE_ID・CF_TUNNEL_ID は cloud-api-env。なければ手で登録する）
            # アプリの YAML を置く専用リポジトリ（<環境>/<名前>.yaml）。書き込むトークン（APPS_REPO_TOKEN）は cloud-api-env に入れる。
            # トークンがなければホスティングは使えないだけで、ほかは動く
            - { name: APPS_REPO, value: "JavaLangRuntimeException/taramanji-cloud-apps" }
            - { name: CF_ACCESS_TEAM_DOMAIN, value: "https://solitary-sun-32e2.cloudflareaccess.com" }
          envFrom:
            # CF_ACCESS_AUD・ADMIN_EMAIL（本番は DD_METRICS_API_KEY・DD_METRICS_APP_KEY も）
            - secretRef: { name: cloud-api-env }
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-api
  labels:
    app.kubernetes.io/name: cloud-api
spec:
  selector:
    app.kubernetes.io/name: cloud-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      appProtocol: kubernetes.io/h2c
