# コンソール（cloud.taramanji.com）。taramanji.com とは別の Gateway（cloud-gateway/cloud）にだけ付ける
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: console
spec:
  parentRefs:
    - { name: cloud, namespace: cloud-gateway, sectionName: http }
  # 環境ごとのホスト名はオーバーレイで差し替える
  hostnames: ["cloud.taramanji.com"]
  rules:
    # API（Connect）。PathPrefix は「/ で区切った単位」で比べるので、サービス名まで書く
    #（/taramanji.cloud.v1. だと /taramanji.cloud.v1.ConsoleService/… に当たらず、画面の nginx に行って 405 になる）
    - matches:
        - { path: { type: PathPrefix, value: /taramanji.cloud.v1.ConsoleService/ } }
      backendRefs:
        - { name: cloud-api, port: 8080 }
    # オブジェクトのアップロード・ダウンロード（Connect ではない HTTP）。画面の /storage とぶつからない名前にしてある
    - matches:
        - { path: { type: PathPrefix, value: /_objects/ } }
      backendRefs:
        - { name: cloud-api, port: 8080 }
    - matches:
        - { path: { type: PathPrefix, value: / } }
      backendRefs:
        - { name: console, port: 8080 }
