# 環境の共有の namespace（taramanji-cloud-apps など）の囲い。ここには API・CDN の HTTPRoute と、関数の登録・バケット・データベースの定義
# （ConfigMap）だけを置き、Pod は動かせない。関数はコントローラーが作る関数ごとの namespace（taramanji-cloud-fn-<名前> など）で動く
apiVersion: v1
kind: ResourceQuota
metadata:
  name: registry
spec:
  hard:
    pods: "0"
    persistentvolumeclaims: "0"
    services.nodeports: "0"
    services.loadbalancers: "0"
