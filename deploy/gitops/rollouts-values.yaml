# Argo Rollouts: 本番のカナリア。Gateway API の HTTPRoute の重みを動かすプラグインを読み込む
controller:
  replicas: 1
  trafficRouterPlugins:
    - name: argoproj-labs/gatewayAPI
      location: https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.17.0/gatewayapi-plugin-linux-arm64
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
dashboard:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
