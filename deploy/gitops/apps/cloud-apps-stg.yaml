# taramanji cloud の stg に置くアプリ。アプリ専用のリポジトリの stg/ にある YAML を、そのまま cloud-stg-apps に入れる。
# コンソールで作る・変える・消すと stg/<名前>.yaml がコミットされ、ここが同期する（手で push しても同じ）
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-apps-stg
  namespace: argocd
spec:
  project: cloud-apps
  source:
    repoURL: git@github.com:JavaLangRuntimeException/taramanji-cloud-apps.git
    targetRevision: main
    path: stg
    # <環境>/functions・<環境>/apis の下まで読む
    directory: { recurse: true }
  destination:
    server: https://kubernetes.default.svc
    namespace: cloud-stg-apps
  syncPolicy:
    automated: { prune: true, selfHeal: true }
  # 関数の台数は API Gateway（cloud-gw）が 0 と 1 を行き来させる。Argo CD は戻さない
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas]
