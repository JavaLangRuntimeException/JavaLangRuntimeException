# taramanji cloud に置くアプリ（コンソールが作る / 手で書く Kubernetes の YAML）の Argo CD プロジェクト。
# 元はアプリ専用のリポジトリだけ。入れられるのはアプリ用の namespace だけで、種類も Deployment・Service・HTTPRoute・ConfigMap・PVC に限る。
# コンソールのトークンやこのリポジトリが乗っ取られても、taramanji.com・コンソール自身・クラスター全体のものには書けない
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cloud-apps
  namespace: argocd
spec:
  description: taramanji cloud に置くアプリ
  sourceRepos:
    - git@github.com:JavaLangRuntimeException/taramanji-cloud-apps.git
  destinations:
    - { server: https://kubernetes.default.svc, namespace: cloud-apps }
    - { server: https://kubernetes.default.svc, namespace: cloud-stg-apps }
    - { server: https://kubernetes.default.svc, namespace: cloud-dev-apps }
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - { group: apps, kind: Deployment }
    - { group: "", kind: Service }
    - { group: "", kind: ConfigMap }
    - { group: "", kind: PersistentVolumeClaim }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute }
