# dev01〜03（ApplicationSet で 3 つの Application を作る）。main への PR（と手動実行）で CI が空いている devN を選び、
# overlays/devNN の版を書き換える → ここが同期する。どの devN を選ぶかは deploy/k8s/scripts/pick-dev.sh
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: taramanji-dev
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - { env: dev01 }
          - { env: dev02 }
          - { env: dev03 }
  template:
    metadata:
      name: "taramanji-{{.env}}"
      annotations:
        # 既定値（Kubernetes が補う値）を差分にしないよう、比較は API サーバー側で行う
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: default
      source:
        repoURL: git@github.com:JavaLangRuntimeException/JavaLangRuntimeException.git
        targetRevision: main
        path: "deploy/k8s/overlays/{{.env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "taramanji-{{.env}}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - ServerSideApply=true
