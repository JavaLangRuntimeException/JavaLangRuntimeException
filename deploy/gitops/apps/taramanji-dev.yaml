# dev。main への PR（と手動実行）で CI が overlays/dev の版を書き換え、ここが同期する
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    # 既定値（Kubernetes が補う値）を差分にしないよう、比較は API サーバー側で行う
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  name: taramanji-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:JavaLangRuntimeException/JavaLangRuntimeException.git
    targetRevision: main
    path: deploy/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: taramanji-dev
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
