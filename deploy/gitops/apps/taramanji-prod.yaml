# 本番。リリース（v* タグ）で CI が overlays/prod の版を書き換え、ここが同期 → Argo Rollouts がカナリアで入れ替える
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    # 既定値（Kubernetes が補う値）を差分にしないよう、比較は API サーバー側で行う
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  name: taramanji-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:JavaLangRuntimeException/JavaLangRuntimeException.git
    targetRevision: main
    path: deploy/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true   # 自動同期でも ignoreDifferences の項目を上書きしない
  # Rollout が Pod を持つので Deployment の台数（0）と HPA が動かす台数は差分にしない
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers: [/spec/replicas]
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions: [".spec.rules[].backendRefs[].weight"]
    # カナリア中は Argo Rollouts が Service の selector に rollouts-pod-template-hash を足す（stable / canary の振り分け）
    - group: ""
      kind: Service
      jqPathExpressions: ['.spec.selector["rollouts-pod-template-hash"]']
