# taramanji cloud の Argo CD プロジェクト。cloud の namespace にしか書けない（taramanji・data・gateway・cloudflared には触れない）。
# クラスター全体のものは Namespace だけ（PriorityClass・ClusterRole は deploy/cloud/cluster を taramanji-cloud-cluster アプリが default プロジェクトで同期する）
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: taramanji-cloud
  namespace: argocd
spec:
  description: taramanji cloud（cloud.taramanji.com）
  sourceRepos:
    - git@github.com:JavaLangRuntimeException/JavaLangRuntimeException.git
  destinations:
    - { server: https://kubernetes.default.svc, namespace: taramanji-cloud }
    - { server: https://kubernetes.default.svc, namespace: taramanji-cloud-stg }
    - { server: https://kubernetes.default.svc, namespace: taramanji-cloud-dev }
    - { server: https://kubernetes.default.svc, namespace: taramanji-cloud-apps }
    - { server: https://kubernetes.default.svc, namespace: taramanji-cloud-gateway }
    - { server: https://kubernetes.default.svc, namespace: taramanji-cloud-cloudflared }
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
