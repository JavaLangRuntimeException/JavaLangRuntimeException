# taramanji cloud の dev に置くアプリ。アプリ専用のリポジトリの dev/ にある YAML を、そのまま cloud-dev-apps に入れる。
# コンソールで作る・変える・消すと dev/<名前>.yaml がコミットされ、ここが同期する（手で push しても同じ）
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-apps-dev
  namespace: argocd
spec:
  project: cloud-apps
  source:
    repoURL: git@github.com:JavaLangRuntimeException/taramanji-cloud-apps.git
    targetRevision: main
    path: dev
    # <環境>/functions・<環境>/apis の下まで読む
    directory: { recurse: true }
  destination:
    server: https://kubernetes.default.svc
    namespace: cloud-dev-apps
  syncPolicy:
    # 最後の 1 つを消したとき（YAML が 0 個）も、クラスターから消す（既定では空への同期をしない）
    automated: { prune: true, selfHeal: true, allowEmpty: true }
    # 関数の namespace は、コントローラーが登録を見て作る（20 秒ほどかかる）。それまでの失敗は、待ってやり直す
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
  # 関数の台数は API Gateway（cloud-gw）が 0 と 1 を行き来させる。Argo CD は戻さない
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas]
