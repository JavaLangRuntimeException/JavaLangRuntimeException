# stg。rc タグ（v1.2.3-rc.1）で CI が overlays/stg の版を書き換え、ここが同期する
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taramanji-stg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JavaLangRuntimeException/JavaLangRuntimeException.git
    targetRevision: main
    path: deploy/k8s/overlays/stg
  destination:
    server: https://kubernetes.default.svc
    namespace: taramanji-stg
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
