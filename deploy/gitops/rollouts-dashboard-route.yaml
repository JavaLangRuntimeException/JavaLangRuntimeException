# Argo Rollouts の画面（本番のカナリアの Promote / Promote-Full / Abort / Retry）を rollouts.taramanji.com で開く。
# 画面自体にはログインがないので、Cloudflare Access（deploy/cloudflare/access.py の taramanji-rollouts）で管理者だけに絞る。
# DNS（staging トンネル taramanji-kind への CNAME）は Access を作ったあとに足すこと。
apiVersion: v1
kind: Namespace
metadata:
  name: argo-rollouts
  labels:
    taramanji.com/gateway-access: "true"   # Gateway がこの namespace の HTTPRoute を受け付ける
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rollouts-dashboard
  namespace: argo-rollouts
spec:
  parentRefs:
    - { name: taramanji, namespace: gateway, sectionName: http }
  hostnames: ["rollouts.taramanji.com"]
  rules:
    - backendRefs:
        - { name: argo-rollouts-dashboard, port: 3100 }
