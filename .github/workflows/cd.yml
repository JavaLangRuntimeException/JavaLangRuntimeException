# cd: 環境の版を書き換えて main にコミットする（Argo CD がそれを見て同期する）
#   main への PR       → build が成功したら dev01〜03 のどれか（同じリポジトリのブランチからの PR だけ。フォークは書き込めない）
#                        その PR がいま入っている devN、なければ一番前に使われた devN に出す（scripts/pick-dev.sh）。
#                        版は stg（main の最新）にそろえてから、その PR で作り直したサービスだけを書き換える
#   main への push     → build が成功したら stg
#   手動実行           → 選んだブランチを lint・test・security・build してから dev（dev01〜03 のどれか。PR と同じ選び方）か stg
#   タグ（v*）の push  → 本番（prod）。前のタグから変わったサービスだけ、stg に出ているのと同じイメージに版のタグを付け、
#                        Argo Rollouts がカナリアで入れ替える
# 版を書き換えるのは、そのコミットで作り直したサービスだけ（変わっていないサービスは今の版のまま＝入れ替わらない）
# build の成功で動くとき（workflow_run）は、同じコミットの lint・test・security が成功したことも確かめてから反映する
name: cd

on:
  workflow_run:
    workflows: [build]
    types: [completed]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: 反映する環境
        type: choice
        options: [dev, stg]
        default: dev

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/javalangruntimeexception

jobs:
  # build の成功を受けて、どの環境に何を出すかを決める
  gate:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (
        (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      sha: ${{ github.event.workflow_run.head_sha }}
      source: ${{ steps.target.outputs.source }}
    steps:
      - name: Target
        id: target
        env:
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            if [ -n "$PR" ]; then SRC="https://github.com/$GITHUB_REPOSITORY/pull/$PR"; else SRC="$BRANCH"; fi
            echo "source=$SRC" >> "$GITHUB_OUTPUT"
          else
            echo "environment=stg" >> "$GITHUB_OUTPUT"
            echo "source=$BRANCH" >> "$GITHUB_OUTPUT"
          fi
      - name: lint・test・security of the same commit succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          for wf in lint test security; do
            for i in $(seq 1 60); do
              res=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf.yml" --commit "$SHA" --event "$EVENT" -L 1 \
                --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
              case "$res" in "completed "*) break ;; esac
              echo "$wf を待っています ($i/60): ${res:-まだ始まっていない}"; sleep 20
            done
            [ "$res" = "completed success" ] || { echo "::error::$wf が成功していません（$res）"; exit 1; }
            echo "$wf: OK"
          done

  # 手動実行: 選んだブランチをその場で確かめてイメージを作る
  lint:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/lint.yml
  test:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/test.yml
  security:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: read
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: [lint, test, security]
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write

  deploy-dev:
    needs: [gate, build]
    if: >-
      !cancelled() && (
        (needs.gate.result == 'success' && needs.gate.outputs.environment == 'dev') ||
        (needs.build.result == 'success' && inputs.environment == 'dev')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      pull-requests: write
    concurrency:
      group: deploy-manifests
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # どの devN を使うかを、過去の deploy(devNN) コミットから決める
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump dev01〜03 のどれか（stg の版 + 作り直したサービス）
        id: bump
        env:
          SHA: ${{ needs.gate.outputs.sha || github.sha }}
          SOURCE: ${{ needs.gate.outputs.source || github.ref_name }}
        run: |
          TAG="sha-${SHA::7}"
          services="$(deploy/k8s/scripts/built-services.sh "$TAG")"
          echo "版を書き換えるサービス: ${services:-（なし）}"
          [ -n "$services" ] || exit 0
          env="$(deploy/k8s/scripts/pick-dev.sh "$SOURCE")"
          echo "出す先: $env"
          echo "env=$env" >> "$GITHUB_OUTPUT"
          # 前にその devN を使っていた PR の版を残さないよう、まず stg（main の最新）にそろえる
          deploy/k8s/scripts/copy-versions.sh stg "$env"
          # shellcheck disable=SC2086
          deploy/k8s/scripts/bump-and-push.sh "$env" "$TAG" "$SOURCE" $services
          echo "### $env に出しました: https://$env.taramanji.com（$services）" >> "$GITHUB_STEP_SUMMARY"
      - name: PR にどこへ出したかを書く
        if: steps.bump.outputs.env != '' && startsWith(needs.gate.outputs.source, 'https://')
        env:
          GH_TOKEN: ${{ github.token }}
          ENV_NAME: ${{ steps.bump.outputs.env }}
          PR_URL: ${{ needs.gate.outputs.source }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          body="**${ENV_NAME}** に出しました（\`${SHA::7}\`）: https://${ENV_NAME}.taramanji.com ・ https://${ENV_NAME}-gws.taramanji.com
          入れ替わりの様子: https://rollouts.taramanji.com（名前空間 taramanji-${ENV_NAME}）"
          # 同じ PR で何度出しても、コメントは 1 つを書き換える
          gh pr comment "$PR_URL" --body "$body" --edit-last --create-if-none

  deploy-stg:
    needs: [gate, build]
    if: >-
      !cancelled() && (
        (needs.gate.result == 'success' && needs.gate.outputs.environment == 'stg') ||
        (needs.build.result == 'success' && inputs.environment == 'stg')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    concurrency:
      group: deploy-manifests
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump stg（作り直したサービスだけ）
        env:
          SHA: ${{ needs.gate.outputs.sha || github.sha }}
          SOURCE: ${{ needs.gate.outputs.source || github.ref_name }}
        run: |
          TAG="sha-${SHA::7}"
          services="$(deploy/k8s/scripts/built-services.sh "$TAG")"
          echo "版を書き換えるサービス: ${services:-（なし）}"
          [ -n "$services" ] || exit 0
          # shellcheck disable=SC2086
          deploy/k8s/scripts/bump-and-push.sh stg "$TAG" "$SOURCE" $services

  deploy-prod:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    concurrency:
      group: deploy-manifests
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::タグは main のコミットに打ってください"; exit 1; }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Wait for the build of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # タグと同時に main の build が走っていることがある。終わる前に探すと古いイメージを使ってしまうので待つ
          for i in $(seq 1 60); do
            res="$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --commit "$GITHUB_SHA" --event push -L 1 --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')"
            case "$res" in "" ) echo "このコミットの build はない"; exit 0 ;; "completed success") exit 0 ;; completed*) echo "::error::build が失敗しています（$res）"; exit 1 ;; esac
            echo "build を待っています ($i/60): $res"; sleep 30
          done
          exit 1
      - name: Tag images of the changed services
        id: rel
        run: |
          services="$(deploy/k8s/scripts/release-images.sh "$GITHUB_REF_NAME" "$GITHUB_SHA")"
          echo "services=$services" >> "$GITHUB_OUTPUT"
      - name: Bump prod（変わったサービスだけ）
        env:
          SERVICES: ${{ steps.rel.outputs.services }}
        run: |
          [ -n "$SERVICES" ] || { echo "変わったサービスはない"; exit 0; }
          git checkout main
          git pull origin main
          # shellcheck disable=SC2086
          deploy/k8s/scripts/bump-and-push.sh prod "$GITHUB_REF_NAME" "" $SERVICES
      - name: GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --notes "リリースしたサービス: ${SERVICES:-（なし）}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICES: ${{ steps.rel.outputs.services }}
