# build: サービスごとのコンテナイメージをビルドし、GHCR に sha-xxxxxxx で push する
# 成功すると cd ワークフローが動く（workflow_run）
name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/javalangruntimeexception
  # イメージを push するか（フォークからの PR はトークンが読み取り専用なので push しない）
  PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [identity, notification, inquiry, reservation, worklocation, content, calendarsync, analytics, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Go も Vite もビルドする側のアーキテクチャで動き、実行イメージはコピーだけなので QEMU なしで 2 アーキテクチャ作れる
      # arm64 は Mac mini の kind、amd64 は GKE 用
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'web' && 'frontend' || 'backend' }}
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ steps.v.outputs.tag }}
          platforms: linux/arm64,linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.REGISTRY }}/taramanji-${{ matrix.service }}:${{ steps.v.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          # main と PR のビルドが同時に同じキャッシュへ書くと失敗することがあるので、キャッシュの書き込み失敗はビルドの失敗にしない
          cache-to: type=gha,mode=max,scope=${{ matrix.service }},ignore-error=true
