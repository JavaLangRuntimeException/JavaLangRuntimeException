# build: 変わったサービスだけコンテナイメージをビルドし、GHCR に sha-xxxxxxx で push する
#   どのサービスを作るかは deploy/k8s/scripts/changed-services.py が決める（Go は依存関係で判定。共通部分を変えたら使っている全サービス）
#   sha は PR なら PR の先頭のコミット、push なら push したコミット（cd が同じ sha で版を書き換える）
# 成功すると cd ワークフローが動く（workflow_run）
name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/javalangruntimeexception
  # イメージを push するか（フォークからの PR はトークンが読み取り専用なので push しない）
  PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.c.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Services to build
        id: c
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) BASE="$(git merge-base "$PR_BASE" HEAD)" ;;
            push) BASE="$BEFORE" ;;
            *) BASE="" ;;   # 手動実行（cd から呼ばれる）は全部作る
          esac
          list="$(deploy/k8s/scripts/changed-services.py --base "$BASE" --head HEAD)"
          echo "作るサービス: ${list:-（なし）}"
          # shellcheck disable=SC2086
          echo "services=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1:]))' $list)" >> "$GITHUB_OUTPUT"

  image:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "tag=sha-${SHA::7}" >> "$GITHUB_OUTPUT"
      # Go も Vite もビルドする側のアーキテクチャで動き、実行イメージはコピーだけなので QEMU なしで 2 アーキテクチャ作れる
      # arm64 は Mac mini の kind、amd64 は GKE 用
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'web' && 'frontend' || 'backend' }}
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ steps.v.outputs.tag }}
          platforms: linux/arm64,linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.REGISTRY }}/taramanji-${{ matrix.service }}:${{ steps.v.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          # main と PR のビルドが同時に同じキャッシュへ書くと失敗することがあるので、キャッシュの書き込み失敗はビルドの失敗にしない
          cache-to: type=gha,mode=max,scope=${{ matrix.service }},ignore-error=true
