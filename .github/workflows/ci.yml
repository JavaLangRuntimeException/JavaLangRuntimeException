# CI: テスト・型・マニフェスト・イメージのビルドを確かめ、環境の版を書き換える（Argo CD が同期する）
#   main への PR       → イメージを push → dev の版を書き換え（同じリポジトリのブランチからの PR だけ。フォークは書き込めない）
#   main への push     → イメージを push → stg の版を書き換え
#   手動実行           → 選んだブランチのイメージを push → dev か stg の版を書き換え
#   本番はタグ（v*）で release ワークフローが書き換える
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 反映する環境
        type: choice
        options: [dev, stg]
        default: dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/javalangruntimeexception
  # イメージを push するか（フォークからの PR はトークンが読み取り専用なので push しない）
  PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install buf and mss-protoc-gen
        run: make install-tools
      - name: proto lint
        run: PATH="$(go env GOPATH)/bin:$PATH" buf lint
      - name: Generated code is up to date
        run: |
          make proto-gen
          if [ -n "$(git status --porcelain .)" ]; then
            echo "::error::生成コードが古い。make proto-gen を実行してコミットしてください"
            git --no-pager diff --stat .
            exit 1
          fi
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: make build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run gen
          if [ -n "$(git status --porcelain src/shared/api/gen)" ]; then
            echo "::error::connect-es の型が古い。npm run gen を実行してコミットしてください"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint:fsd
      - run: npm test
      - run: npm run build

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
      - name: Render and validate (dev / prod / gke)
        run: |
          for env in dev stg prod gke; do
            echo "== $env"
            kubectl kustomize deploy/k8s/overlays/$env > /tmp/$env.yaml
            kubeconform -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              /tmp/$env.yaml
          done
      - name: No plaintext Secret in the repo
        run: |
          if grep -rlE '^kind: Secret$' deploy/k8s/overlays deploy/k8s/base; then
            echo "::error::平文の Secret があります。scripts/seal.sh で SealedSecret にしてください"
            exit 1
          fi

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    needs: [backend, frontend, manifests, secrets-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [identity, notification, inquiry, reservation, worklocation, content, calendarsync, analytics, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Go も Vite もビルドする側のアーキテクチャで動き、実行イメージはコピーだけなので QEMU なしで 2 アーキテクチャ作れる
      # arm64 は Mac mini の kind、amd64 は GKE 用
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'web' && 'frontend' || 'backend' }}
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ steps.v.outputs.tag }}
          platforms: linux/arm64,linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.REGISTRY }}/taramanji-${{ matrix.service }}:${{ steps.v.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          # main と PR のビルドが同時に同じキャッシュへ書くと失敗することがあるので、キャッシュの書き込み失敗はビルドの失敗にしない
          cache-to: type=gha,mode=max,scope=${{ matrix.service }},ignore-error=true

  deploy-dev:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    needs: [images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-manifests
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump dev to this build
        run: deploy/k8s/scripts/bump-and-push.sh dev "sha-${GITHUB_SHA::7}" "${{ github.event.pull_request.html_url || github.ref_name }}"

  deploy-stg:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'stg')
    needs: [images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-manifests
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump stg to this build
        run: deploy/k8s/scripts/bump-and-push.sh stg "sha-${GITHUB_SHA::7}" "${{ github.ref_name }}"
