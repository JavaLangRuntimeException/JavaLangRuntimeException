syntax = "proto3";

package taramanji.content.v1;

// 外部の公開情報（Qiita・connpass・ORCID・OGP）
service ContentService {
  rpc ListQiitaItems(ListQiitaItemsRequest) returns (ListQiitaItemsResponse) {}
  // Qiita のプロフィールからピックアップ記事と新着記事
  rpc ScrapeQiitaProfile(ScrapeQiitaProfileRequest) returns (ScrapeQiitaProfileResponse) {}
  // 記事内の「チートシート」リンク一覧
  rpc ScrapeQiitaArticleLinks(ScrapeQiitaArticleLinksRequest) returns (ScrapeQiitaArticleLinksResponse) {}
  rpc ListConnpassEvents(ListConnpassEventsRequest) returns (ListConnpassEventsResponse) {}
  rpc ListOrcidWorks(ListOrcidWorksRequest) returns (ListOrcidWorksResponse) {}
  rpc GetOgp(GetOgpRequest) returns (GetOgpResponse) {}
}

message ListQiitaItemsRequest {
  int32 page = 1;
  bool initial = 2;
  bool include_tags = 3;
  int32 per_page = 4;
}

message QiitaTag {
  string name = 1;
  repeated string versions = 2;
}

message QiitaItem {
  string url = 1;
  string title = 2;
  string body = 3;
  repeated QiitaTag tags = 4;
}

message ListQiitaItemsResponse {
  // include_tags のとき items、そうでなければ urls
  repeated string urls = 1;
  repeated QiitaItem items = 2;
}

message ScrapeQiitaProfileRequest {}

message ScrapedArticle {
  string url = 1;
  string title = 2;
  repeated string tags = 3;
}

message ScrapeQiitaProfileResponse {
  repeated ScrapedArticle pickup_articles = 1;
  repeated ScrapedArticle latest_articles = 2;
}

message ScrapeQiitaArticleLinksRequest {
  string url = 1;
}

message ArticleLink {
  string url = 1;
  string title = 2;
}

message ScrapeQiitaArticleLinksResponse {
  repeated ArticleLink links = 1;
}

message ListConnpassEventsRequest {
  string nickname = 1;
}

message ConnpassEvent {
  int64 event_id = 1;
  string title = 2;
  string catch = 3;
  string event_url = 4;
  string started_at = 5;
  string ended_at = 6;
  int32 limit = 7;
  int32 accepted = 8;
  int32 waiting = 9;
  string place = 10;
  string address = 11;
  string image_url = 12;
}

message ListConnpassEventsResponse {
  int32 results_returned = 1;
  int32 results_available = 2;
  int32 results_start = 3;
  repeated ConnpassEvent events = 4;
}

message ListOrcidWorksRequest {}

message OrcidWork {
  int64 put_code = 1;
  string title = 2;
  string type = 3;
  string venue = 4;
  string date = 5;
  string doi = 6;
  string url = 7;
  repeated string authors = 8;
}

message ListOrcidWorksResponse {
  string orcid_id = 1;
  repeated OrcidWork works = 2;
}

message GetOgpRequest {
  repeated string urls = 1;
  bool no_cache = 2;
}

message Ogp {
  string url = 1;
  string title = 2;
  string description = 3;
  repeated string images = 4;
  string site_name = 5;
  string media_type = 6;
  string content_type = 7;
  repeated string favicons = 8;
}

message GetOgpResponse {
  // 入力と同じ順番。取得できない URL は空の Ogp
  repeated Ogp data = 1;
}
