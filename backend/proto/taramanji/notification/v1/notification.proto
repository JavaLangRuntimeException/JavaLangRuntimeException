syntax = "proto3";

package taramanji.notification.v1;

// メール送信（Amazon SES）。クラスター内からのみ gRPC で呼ばれる
service NotificationService {
  rpc SendEmail(SendEmailRequest) returns (SendEmailResponse) {}
}

message Attachment {
  string filename = 1;
  string content_type = 2;
  bytes data = 3;
}

message SendEmailRequest {
  repeated string to = 1;
  string subject = 2;
  string text = 3;
  repeated Attachment attachments = 4;
  // true なら SES の鍵がない環境（開発用の送信しないモード）をエラーにする（アンケート用）
  bool require_delivery = 5;
}

message SendEmailResponse {
  string message_id = 1;
  // SES の鍵がなく、実際には送っていない
  bool dev = 2;
}
