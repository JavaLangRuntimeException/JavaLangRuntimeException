# gitleaks の設定（CI の secrets-scan）。既定のルールに、誤検知になる次のファイルだけを除外する
[extend]
useDefault = true

[allowlist]
description = "暗号化済み・公開前提のもの"
paths = [
  # Sealed Secrets（クラスターの鍵でしか復号できない暗号文）
  '''deploy/k8s/overlays/.+/sealed/.+\.yaml''',
  # Datadog RUM のクライアントトークン（ブラウザに配る公開値）
  '''frontend/\.env\.production''',
  # テスト専用に作った使い捨ての鍵（本番の鍵ではない）
  '''backend/internal/calendarsync/infra/gateway/cipher_test\.go''',
]
